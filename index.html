               linear-gradient(to bottom, rgba(0,0,0,.6), transparent 25%); }

  /* Yuqori panel */
  .top { position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between;
    align-items:center; padding:2.2vw 3.5vw; z-index:2; }
  .brand { font-size:1.6vw; font-weight:700; letter-spacing:.05em; }
  .brand b { color:var(--accent); }
  .clock { font-size:1.8vw; font-weight:500; opacity:.9; }

  /* Sarlavha */
  .hero { position:fixed; left:3.5vw; bottom:24vw; z-index:2; max-width:50vw; }
  .hero h1 { font-size:4vw; font-weight:300; transition:opacity .2s; }
  .hero p { margin-top:.6vw; font-size:1.4vw; opacity:.7; }

  /* Ilovalar qatori */
  .apps { position:fixed; left:0; right:0; bottom:4vw; z-index:2;
    display:flex; gap:var(--gap); padding:2vw 3.5vw; overflow-x:auto; scrollbar-width:none; }
  .apps::-webkit-scrollbar { display:none; }
  .app { flex:0 0 17vw; aspect-ratio:16/9; border-radius:1vw; overflow:hidden;
    background:#000; outline:none; cursor:pointer; position:relative; display:block;
    transition:transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s; }
  .app img { width:100%; height:100%; object-fit:cover; display:block; }
  .app:hover, .app:focus {
    transform:scale(1.14); z-index:3;
    box-shadow:0 0 0 .22vw #fff, 0 1.5vw 3vw rgba(0,0,0,.7), 0 0 3vw rgba(0,229,255,.35); }
</style>

<script>
  const apps = [...document.querySelectorAll('.app')];
  const title = document.getElementById('title');
  let i = 1; // boshida CineClub tanlangan

  function focusApp(n) {
    i = (n + apps.length) % apps.length;
    apps[i].focus({ preventScroll:true });
    apps[i].scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
    title.textContent = apps[i].dataset.name;
  }
  apps.forEach((a, n) => {
    a.addEventListener('focus',      () => { i = n; title.textContent = a.dataset.name; });
    a.addEventListener('mouseenter', () => focusApp(n));
  });

  // Pult / klaviatura: ← → va Enter
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') { focusApp(i + 1); e.preventDefault(); }
    if (e.key === 'ArrowLeft')  { focusApp(i - 1); e.preventDefault(); }
    if (e.key === 'Enter')      { apps[i].click(); }
  });

  // Soat
  const clock = document.getElementById('clock');
  const tick = () => clock.textContent =
    new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  tick(); setInterval(tick, 10000);

  focusApp(1);
</script>
